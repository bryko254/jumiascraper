<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Jumia Price Monitor — Settings</title>
    <link rel="stylesheet" href="popup.css" />
    <style>
      body {
        width: auto;
        max-width: 560px;
        margin: 24px auto;
        padding: 0 16px 32px;
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div>
        <h1>Settings</h1>
        <p class="muted">The extension is UI-only. Scraping and alerts run on your server.</p>
      </div>
    </header>
    <section class="card">
      <label class="field">
        API base URL
        <input id="api-base" type="url" placeholder="http://127.0.0.1:8001" />
      </label>
      <button id="save" class="primary">Save</button>
      <p id="msg" class="msg"></p>
      <p class="muted">Default for docker compose is <code>http://127.0.0.1:8001</code>. If you use another host, Chrome will ask for permission to reach it.</p>
    </section>
    <script src="config.js"></script>
    <script src="options.js"></script>
  </body>
</html>
